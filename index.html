<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <header class="header">
        <img class="header__image" src="./eisenhower-matrix.jpg" alt="eisenhower matrix
        ">
        <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <section id="add-item">
        <label for="new-task" class="add-item__label">Add Item</label>
        <div class="add-item__wrapper">
            <input id="new-task"class="input task input-text" type="text">
            <button class="button">Add</button>
        </div>
      </section>
      <section>
        <h3 class="section-title">Todo</h3>
        <ul class="list" id="incomplete-tasks">
          <li class="list__item">
            <input type="checkbox" class="input list__input-checkbox">
            <label class="list__input-label">Pay Bills</label>
            <input type="text" class="input list__input-text task">
            <button class="button edit">Edit</button>
            <button class="button delete">
            <img class="button__image" src="./remove.svg" alt="delete button"></button>
          </li>
          <li class="list__item edit-mode">
            <input type="checkbox" class="input list__input-checkbox">
            <label class="list__input-label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="input list__input-text task">
            <button class="button edit">Save</button>
            <button class="button delete">
            <img class="button__image" src="./remove.svg" alt="delete button">
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h3 class="section-title">Completed</h3>
        <ul class="list" id="completed-tasks">
          <li class="list__item">
            <input type="checkbox" class="input list__input-checkbox" checked>
            <label class="list__input-label">See the Doctor</label>
            <input type="text" class="input list__input-text task">
            <button class="button edit">Edit</button>
            <button class="button delete">
            <img class="button__image" src="./remove.svg" alt="delete button"></button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
